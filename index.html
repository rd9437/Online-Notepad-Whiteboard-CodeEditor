<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Notepad, Whiteboard & Code Runner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Online Notepad, Whiteboard & Code Runner</h1>
            <p>Notes and sketches save locally while code runs instantly via OneCompiler</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab(this, 'notepad')">
                📝 Notepad
            </button>
            <button class="tab" onclick="switchTab(this, 'whiteboard')">
                🎨 Whiteboard
            </button>
            <button class="tab" onclick="switchTab(this, 'code')">
                💻 Code Editor
            </button>
        </div>

        <!-- Notepad Section -->
        <div id="notepad-content" class="content active">
            <div class="notepad-container">
                <div class="notepad-toolbar">
                    <div class="toolbar-group">
                        <button class="tool-btn" data-command="bold" title="Bold"><span class="tool-text">B</span></button>
                        <button class="tool-btn" data-command="italic" title="Italic"><span class="tool-text">I</span></button>
                        <button class="tool-btn" data-command="underline" title="Underline"><span class="tool-text">U</span></button>
                    </div>
                    <div class="toolbar-group">
                        <label for="fontFamily">Font</label>
                        <select id="fontFamily">
                            <option value="Source Serif 4" selected>Source Serif 4</option>
                            <option value="Space Grotesk">Space Grotesk</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                        </select>
                        <label for="fontSize">Size</label>
                        <select id="fontSize">
                            <option value="12">12</option>
                            <option value="14">14</option>
                            <option value="16" selected>16</option>
                            <option value="18">18</option>
                            <option value="22">22</option>
                            <option value="26">26</option>
                            <option value="32">32</option>
                        </select>
                    </div>
                    <div class="toolbar-group">
                        <button class="tool-btn" data-command="justifyLeft" title="Align Left">⬅</button>
                        <button class="tool-btn" data-command="justifyCenter" title="Align Center">↔</button>
                        <button class="tool-btn" data-command="justifyRight" title="Align Right">➡</button>
                        <button class="tool-btn" data-command="justifyFull" title="Justify">☰</button>
                    </div>
                    <div class="toolbar-group">
                        <button class="tool-btn" data-command="insertUnorderedList" title="Bulleted List">• List</button>
                        <button class="tool-btn" data-command="insertOrderedList" title="Numbered List">1. List</button>
                    </div>
                    <div class="toolbar-group">
                        <label for="textColor">Text</label>
                        <input type="color" id="textColor" value="#1b1f2a">
                        <label for="highlightColor">Highlight</label>
                        <input type="color" id="highlightColor" value="#fff2ac">
                    </div>
                    <div class="toolbar-group">
                        <label for="lineSpacing">Line</label>
                        <select id="lineSpacing">
                            <option value="1.2">1.2</option>
                            <option value="1.4">1.4</option>
                            <option value="1.6" selected>1.6</option>
                            <option value="1.8">1.8</option>
                            <option value="2">2.0</option>
                        </select>
                    </div>
                    <div class="toolbar-group">
                        <button class="tool-btn" id="undoBtn" title="Undo">↶ Undo</button>
                        <button class="tool-btn" id="redoBtn" title="Redo">↷ Redo</button>
                    </div>
                    <div class="toolbar-group">
                        <button class="tool-btn" id="insertImageBtn">🖼 Insert Image</button>
                        <input type="file" id="insertImageInput" accept="image/*" hidden>
                    </div>
                    <div class="toolbar-group toolbar-actions">
                        <button class="tool-btn" onclick="clearNotepad()">🗑️ Clear</button>
                        <label for="exportFormat">Export</label>
                        <select id="exportFormat">
                            <option value="txt" selected>TXT</option>
                            <option value="html">HTML</option>
                            <option value="rtf">RTF</option>
                            <option value="pdf">PDF</option>
                        </select>
                        <button class="tool-btn" id="exportBtn">💾 Download</button>
                        <button class="tool-btn" onclick="copyNotepad()">📋 Copy</button>
                    </div>
                </div>
                <div id="notepad-editor" class="notepad-editor" contenteditable="true" spellcheck="true" data-placeholder="Start typing your notes here..."></div>
                <div class="notepad-status-bar">
                    <div class="notepad-metrics" id="notepad-metrics">Words: 0 | Characters: 0 | Page 1</div>
                    <div class="status" id="notepad-status">Auto-save enabled</div>
                </div>
            </div>
        </div>

        <!-- Whiteboard Section -->
        <div id="whiteboard-content" class="content">
            <div class="whiteboard-container">
                <div class="whiteboard-toolbar">
                    <div class="toolbar-group">
                        <label>Color:</label>
                        <input type="color" id="colorPicker" value="#000000">
                    </div>
                    <div class="toolbar-group">
                        <label>Brush Size:</label>
                        <input type="range" id="brushSize" min="1" max="50" value="3">
                        <span id="brushSizeValue">3</span>
                    </div>
                    <div class="toolbar-group">
                        <button onclick="clearWhiteboard()">🗑️ Clear Canvas</button>
                        <button onclick="downloadWhiteboard()">💾 Download Image</button>
                        <button onclick="toggleEraser()">✏️ <span id="eraserText">Eraser</span></button>
                    </div>
                </div>
                <div class="canvas-wrapper">
                    <canvas id="whiteboardCanvas" width="1000" height="600"></canvas>
                </div>
                <div class="status" id="whiteboard-status">Auto-save enabled</div>
            </div>
        </div>

        <!-- Code Editor Section -->
        <div id="code-content" class="content">
            <div class="code-editor-container">
                <div class="code-toolbar">
                    <div class="code-toolbar-group">
                        <label for="compilerLanguage">Language:</label>
                        <select id="compilerLanguage">
                            <option value="python">Python</option>
                            <option value="javascript">JavaScript</option>
                            <option value="java">Java</option>
                            <option value="c">C</option>
                            <option value="cpp">C++</option>
                            <option value="csharp">C#</option>
                            <option value="ruby">Ruby</option>
                            <option value="go">Go</option>
                            <option value="php">PHP</option>
                            <option value="kotlin">Kotlin</option>
                            <option value="swift">Swift</option>
                            <option value="bash">Bash</option>
                            <option value="html">HTML/CSS/JS</option>
                        </select>
                    </div>
                </div>
                <div class="code-embed-wrapper">
                    <iframe
                        id="oneCompilerFrame"
                        title="OneCompiler embedded IDE"
                        src=""
                        frameborder="0"
                        allow="fullscreen"
                        loading="lazy"
                    ></iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Copyright ©<script>document.write(new Date().getFullYear());</script> All rights reserved | By Rudransh Das</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
